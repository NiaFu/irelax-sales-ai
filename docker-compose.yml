services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: irelax_sales_ai
      POSTGRES_USER: irelax
      POSTGRES_PASSWORD: irelax
    ports:
      - "5432:5432"
    volumes:
      - irelax_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U irelax -d irelax_sales_ai"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  irelax_postgres:
